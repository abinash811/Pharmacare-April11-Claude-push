name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps: react-day-picker@8.10.1's peer range (React 16-18)
        # is stale metadata, not a real incompatibility — the app runs on
        # React 19 today. Revisit when react-day-picker ships a v9 that
        # declares React 19 support (its API changed between v8 and v9,
        # so that's a real upgrade, not just a version bump).
        run: npm ci --legacy-peer-deps

      - name: Lint
        # 71 is the real current backlog (see docs/11_TESTING.md), not an
        # aspirational number — CI had never once run this step before
        # (npm ci itself failed on every prior run), so this repo has never
        # actually been lint-checked. Ratchet this down as the backlog is
        # worked through; the goal is 0, this is where "0" would have
        # instantly failed on day one of turning the check on for real.
        run: npm run lint -- --max-warnings 71

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests

  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmacare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test

      - name: Lint
        run: flake8 . --max-line-length=120 --exclude=venv,migrations/versions,__pycache__,server.py

      - name: Test
        run: pytest --tb=short -q
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pharmacare_test
          SECRET_KEY: ci-test-secret-key-not-for-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 1440
